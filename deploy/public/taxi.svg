  <text x="120" y="127" font-family="monospace" font-size="7" font-weight="bold" fill="#111" text-anchor="middle">NYC • 7Y82</text>
  <!-- Checker Stripe on Trunk -->
  <g opacity="0.85">
    <rect x="44" y="98" width="152" height="7" fill="#111"/>
