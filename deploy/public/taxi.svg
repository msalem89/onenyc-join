  <rect x="82" y="30" width="76" height="6" rx="2" fill="#FFB703"/>
  <!-- Taxi Medallion Roof Light -->
  <rect x="100" y="18" width="40" height="14" rx="3" fill="#FFF9E6" stroke="#D4A000" stroke-width="1"/>
  <rect x="101" y="19" width="38" height="12" rx="2" fill="#FFD60A" opacity="0.9"/>
  <text x="120" y="28" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#111" text-anchor="middle" letter-spacing="0.5">NYC TAXI</text>
