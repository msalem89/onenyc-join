    <rect x="48" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="62" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="76" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="90" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="104" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="118" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="132" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="146" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="160" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="174" y="98" width="7" height="7" fill="#FFF"/>
    <rect x="188" y="98" width="7" height="7" fill="#FFF"/>
  </g>
  <!-- Taillights -->
  <rect x="36" y="94" width="18" height="16" rx="4" fill="#FF2A2A" stroke="#CC0000" stroke-width="1"/>
  <rect x="186" y="94" width="18" height="16" rx="4" fill="#FF2A2A" stroke="#CC0000" stroke-width="1"/>
  <rect x="40" y="102" width="10" height="5" rx="1" fill="#FFB703"/>
  <rect x="190" y="102" width="10" height="5" rx="1" fill="#FFB703"/>
